groups:
  - name: hunterclaw_alerts
    interval: 30s
    rules:
      - alert: HighCPUUsage
        expr: hunterclaw_process_cpu_percent > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value }}% (threshold: 80%)"
      
      - alert: HighMemoryUsage
        expr: hunterclaw_process_memory_bytes / 1024 / 1024 / 1024 > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }}GB (threshold: 1GB)"
      
      - alert: HighErrorRate
        expr: rate(hunterclaw_http_requests_total{status=~"5.."}[5m]) / rate(hunterclaw_http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"
      
      - alert: SlowResponseTime
        expr: histogram_quantile(0.95, rate(hunterclaw_http_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow response time (p95)"
          description: "p95 latency is {{ $value }}s (threshold: 5s)"
      
      - alert: ToolCallFailureRate
        expr: rate(hunterclaw_tool_calls_total{status="failure"}[5m]) / rate(hunterclaw_tool_calls_total[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High tool call failure rate"
          description: "Failure rate is {{ $value | humanizePercentage }} (threshold: 10%)"
      
      - alert: NoActiveAgents
        expr: hunterclaw_agents_active == 0
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "No active agents"
          description: "No agents have been active for 10 minutes"
