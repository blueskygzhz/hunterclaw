version: '3.8'

services:
  # ============================================================================
  # HunterClaw Gateway 服务
  # ============================================================================
  hunterclaw:
    image: hunterclaw/hunterclaw:0.1.0
    container_name: hunterclaw-gateway
    restart: unless-stopped
    
    ports:
      - "8080:8080"    # Gateway HTTP/HTTPS
      - "8081:8081"    # Health Check
      - "9090:9090"    # Prometheus Metrics
    
    environment:
      # OpenAI配置
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}
      
      # HunterClaw配置
      - HUNTERCLAW_API_TOKENS=${HUNTERCLAW_API_TOKENS}
      - HUNTERCLAW_SIGNING_SECRET=${HUNTERCLAW_SIGNING_SECRET}
      
      # 飞书配置 (可选)
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - FEISHU_ENCRYPT_KEY=${FEISHU_ENCRYPT_KEY:-}
      - FEISHU_VERIFICATION_TOKEN=${FEISHU_VERIFICATION_TOKEN:-}
      
      # 数据库配置
      - DB_HOST=postgres
      - DB_USER=hunterclaw
      - DB_PASSWORD=${DB_PASSWORD}
      
      # Redis配置
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    
    volumes:
      - ./config/production.yaml:/etc/hunterclaw/config.yaml:ro
      - ./ssl:/etc/hunterclaw/ssl:ro
      - hunterclaw_workspaces:/var/lib/hunterclaw/workspaces
      - hunterclaw_memory:/var/lib/hunterclaw/memory
      - hunterclaw_db:/var/lib/hunterclaw/db
      - hunterclaw_logs:/var/log/hunterclaw
    
    networks:
      - hunterclaw_network
    
    depends_on:
      - postgres
      - redis
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
  
  # ============================================================================
  # PostgreSQL 数据库 (用于Session持久化)
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: hunterclaw-postgres
    restart: unless-stopped
    
    environment:
      - POSTGRES_DB=hunterclaw
      - POSTGRES_USER=hunterclaw
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    
    networks:
      - hunterclaw_network
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunterclaw"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # ============================================================================
  # Redis (用于会话缓存和分布式锁)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: hunterclaw-redis
    restart: unless-stopped
    
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    
    volumes:
      - redis_data:/data
    
    networks:
      - hunterclaw_network
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # ============================================================================
  # Prometheus (监控)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: hunterclaw-prometheus
    restart: unless-stopped
    
    ports:
      - "9091:9090"
    
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    
    networks:
      - hunterclaw_network
  
  # ============================================================================
  # Grafana (可视化)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: hunterclaw-grafana
    restart: unless-stopped
    
    ports:
      - "3000:3000"
    
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    
    networks:
      - hunterclaw_network
    
    depends_on:
      - prometheus
  
  # ============================================================================
  # Jaeger (分布式追踪)
  # ============================================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: hunterclaw-jaeger
    restart: unless-stopped
    
    ports:
      - "16686:16686"  # UI
      - "14268:14268"  # HTTP collector
    
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    
    volumes:
      - jaeger_data:/tmp
    
    networks:
      - hunterclaw_network
  
  # ============================================================================
  # Nginx (反向代理和负载均衡)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: hunterclaw-nginx
    restart: unless-stopped
    
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    
    networks:
      - hunterclaw_network
    
    depends_on:
      - hunterclaw

# ============================================================================
# 网络定义
# ============================================================================
networks:
  hunterclaw_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================================
# 卷定义
# ============================================================================
volumes:
  hunterclaw_workspaces:
    driver: local
  hunterclaw_memory:
    driver: local
  hunterclaw_db:
    driver: local
  hunterclaw_logs:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  jaeger_data:
    driver: local
